<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Noventiq OpsAgent — Multi-Scenario Guided Simulator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="assets/refinements.css" />
  <style>
    /* Scenario Selector Styling */
    .scenario-selector-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .scenario-selector-bar label {
      font-size: 11px;
      color: #94a3b8;
      font-weight: 600;
      white-space: nowrap;
    }
    .scenario-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }
    .scenario-select:focus {
      border-color: #3b82f6;
    }
    .warning-badge-lg {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fed7aa;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .missing-field-row {
      background: #fff7ed !important;
      border-left: 4px solid #f97316 !important;
    }
    .missing-tag {
      color: #ea580c !important;
      font-weight: 800 !important;
    }
    .conflict-banner-lg {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rec-card-box {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 10px;
    }
    .rec-card-box h4 {
      margin: 0 0 6px 0;
      color: #166534;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>

  <template id="shell-template">
    <header class="topbar">
      <div class="brand">
        <img src="assets/nvoentiq logo.png" alt="Noventiq" style="height:36px;object-fit:contain;" />
        <strong>OpsAgent</strong>
        <div class="scenario-selector-bar">
          <label>SCENARIO:</label>
          <select id="scenario-switcher" class="scenario-select">
            <option value="happy">Scenario 1: Happy Flow</option>
            <option value="missing">Scenario 2: Missing Info</option>
            <option value="conflict">Scenario 3: Venue Conflict</option>
          </select>
        </div>
      </div>
      <nav class="stepper" aria-label="Demo workflow"></nav>
      <div class="presenter-controls">
        <button id="previous" title="Previous step" aria-label="Previous step">&lsaquo;</button>
        <button id="pause" class="pause-control" aria-label="Pause guided simulation">
          <img src="assets/pause.svg" alt=""/>
          <span>Pause</span>
        </button>
        <button id="next-step" title="Next step" aria-label="Next step">&rsaquo;</button>
      </div>
    </header>
    <section id="orchestration-bar" class="agentic-orchestration-bar"></section>
    <section class="stage-layout">
      <div id="workspace" class="workspace"></div>
      <aside id="activity" class="activity-panel"></aside>
    </section>
    <footer id="narrator" class="narrator">
      <span class="narrator-icon">✦</span>
      <p></p>
    </footer>
  </template>

    function wirePresenterControls(manualPause=false){
      const pause = document.querySelector('#pause');
      const prev = document.querySelector('#previous');
      const nextBtn = document.querySelector('#next-step');

      if(pause) {
        const pauseSpan = pause.querySelector('span');
        const pauseImg = pause.querySelector('img');
        if(pauseSpan) pauseSpan.textContent = (isPaused || manualPause) ? 'Resume' : 'Pause';
        if(pauseImg) pauseImg.src = (isPaused || manualPause) ? 'assets/play.svg' : 'assets/pause.svg';

        pause.onclick = () => {
          isPaused = !isPaused;
          clearTimeout(autoId);
          if(!isPaused) {
            autoId = setTimeout(() => { screen++; render(); }, 4500);
          }
          if(pauseSpan) pauseSpan.textContent = isPaused ? 'Resume' : 'Pause';
          if(pauseImg) pauseImg.src = isPaused ? 'assets/play.svg' : 'assets/pause.svg';
        };
      }

      if(prev) {
        prev.onclick = () => {
          clearTimeout(autoId);
          if(screen > 0) { screen--; render(); }
        };
      }

      if(nextBtn) {
        nextBtn.onclick = () => {
          clearTimeout(autoId);
          if(screen < 11) { screen++; render(); }
        };
      }
    }

    function next(ms=5200){
      clearTimeout(autoId);
      if(!isPaused) autoId = setTimeout(() => { screen++; render(); }, ms);
    }
